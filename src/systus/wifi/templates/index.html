<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTUS WiFi Setup</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.12);
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --accent2: #6366f1;
        --danger: #ef4444;
    }

    * {
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1e293b, var(--bg));
        color: var(--text);
    }

    .container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
    }

    .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 18px;
        padding: 22px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h1 {
        font-size: 22px;
        margin-bottom: 5px;
        text-align: center;
    }

    .subtitle {
        text-align: center;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 20px;
    }

    label {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-bottom: 6px;
    }

    select, input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid var(--card-border);
        background: rgba(0,0,0,0.25);
        color: var(--text);
        outline: none;
        margin-bottom: 14px;
    }

    select:focus, input:focus {
        border-color: var(--accent);
    }

    .row {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s ease;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-1px);
    }

    .btn-icon {
        width: 48px;
        height: 42px;
        background: rgba(255,255,255,0.08);
        color: var(--text);
        font-size: 16px;
    }

    .btn-icon:hover {
        background: rgba(255,255,255,0.15);
    }

    .status {
        margin-top: 12px;
        font-size: 12px;
        text-align: center;
        color: var(--muted);
    }

    .footer {
        margin-top: 10px;
        text-align: center;
        font-size: 11px;
        color: var(--muted);
    }

    @media (max-width: 480px) {
        .container {
            padding: 10px;
        }

        .card {
            padding: 18px;
        }
    }
</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>🔧 SYSTUS WiFi</h1>
        <div class="subtitle">Connect your device to a network</div>

        <form action="/wifi" method="post">

            <label>Available networks</label>

            <div class="row">
                <select name="ssid" id="ssid">
                    {% for network in networks %}
                        <option value="{{ network }}">{{ network }}</option>
                    {% endfor %}
                </select>

                <button type="button" class="btn-icon" onclick="refreshWifi()">⟳</button>
            </div>

            <label>Password</label>
            <input type="password" name="password" placeholder="••••••••" required>

            <button class="btn-primary" type="submit">
                Connect
            </button>

        </form>

        <div class="status" id="status">Ready</div>

        <div class="footer">
            SYSTUS WiFi Manager
        </div>

    </div>

</div>

<script>
async function refreshWifi() {
    const status = document.getElementById("status");

    status.innerText = "Scanning nearby networks...";

    try {
        await fetch("/wifi/refresh", { method: "POST" });

        status.innerText = "Updating list...";

        setTimeout(() => {
            location.reload();
        }, 1200);

    } catch (e) {
        status.innerText = "Failed to refresh WiFi list.";
    }
}
</script>

</body>
</html>
