<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SYSTUS WiFi Setup</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0f172a;
    --card: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent2: #6366f1;
}

* {
    box-sizing: border-box;
    font-family: Inter, sans-serif;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #1e293b, var(--bg));
    color: var(--text);
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 6px;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
}

/* =========================
   WIFI ROW FIX (IMPORTANT)
========================= */

.wifi-row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
}

/* SELECT FIXED SIZE */
select {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
    color: var(--text);
    height: 44px; /* IMPORTANT FIX: stable UI */
}

/* placeholder style (if empty) */
option {
    background: #0f172a;
    color: white;
}

/* =========================
   REFRESH BUTTON FIX
========================= */

.refresh-btn {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.08);

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
}

.refresh-btn:hover {
    background: rgba(255,255,255,0.15);
}

/* centering PERFECT icon */
.refresh-btn span {
    display: inline-block;
    font-size: 16px;
    line-height: 1;
    color: white;
}

/* =========================
   INPUTS
========================= */

label {
    font-size: 12px;
    color: var(--muted);
    display: block;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
    color: var(--text);
    margin-bottom: 14px;
}

/* =========================
   BUTTON
========================= */

button.primary {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    cursor: pointer;

    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 600;
}

.status {
    margin-top: 12px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 480px) {
    .container {
        padding: 10px;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="card">

    <h1>🛜 SYSTUS WiFi</h1>
    <div class="subtitle">Connect your device to a network</div>

    <form action="/wifi" method="post">

        <label>Available networks</label>

        <div class="wifi-row">

            <select name="ssid">
                {% if networks and networks|length > 0 %}
                    {% for network in networks %}
                        <option value="{{ network }}">{{ network }}</option>
                    {% endfor %}
                {% else %}
                    <option disabled selected>No networks found</option>
                {% endif %}
            </select>

            <button
                class="refresh-btn"
                type="button"
                onclick="window.location.reload()"
            >
                <span>⟳</span>
            </button>

        </div>

        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>

        <button class="primary" type="submit">
            Connect
        </button>

    </form>

    <div class="status" id="status">Ready</div>

</div>

</div>

<script>
async function refreshWifi() {
    const status = document.getElementById("status");
    status.innerText = "Scanning networks...";

    try {
        await fetch("/wifi/refresh", { method: "POST" });

        status.innerText = "Updating...";

        setTimeout(() => {
            location.reload();
        }, 900);

    } catch (e) {
        status.innerText = "Refresh failed";
    }
}
</script>

</body>
</html>
